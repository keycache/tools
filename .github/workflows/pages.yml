name: Deploy static tools

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: scripts/image-models-requirements.txt
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .data/models
          key: image-models-${{ runner.os }}-${{ hashFiles('scripts/prepare-image-models.mjs', 'scripts/export-watermark.py', 'scripts/image-models-requirements.txt') }}
      - name: Install CPU-only export dependencies
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/image-models-requirements.txt
      - run: npm test -- tests/unit/deploySize.test.ts tests/unit/imageAi.test.ts tests/unit/imageModelClient.test.ts tests/unit/imageAiUi.test.tsx tests/unit/base64.test.ts tests/unit/base64Office.test.ts tests/unit/base64Client.test.ts tests/unit/base64Ui.test.tsx tests/unit/ttsZip.test.ts
      - run: npm run build
        env:
          PYTHON: python
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
